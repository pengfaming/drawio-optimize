title: 中文系统架构
direction: TB
preset: balanced
groups:
  - id: 接入层
    label: 接入层（边缘）
  - id: 服务层
    label: 服务层
nodes:
  - id: 客户端
    label: 客户端 App
    kind: external
    group: 接入层
  - id: 网关
    label: API 网关
    kind: interface
    group: 接入层
  - id: 鉴权
    label: 鉴权服务
    kind: controller
    group: 服务层
  - id: 订单
    label: 订单服务
    kind: controller
    group: 服务层
  - id: 数据库
    label: 订单数据库（主库）
    kind: memory
  - id: 缓存
    label: Redis 缓存
    kind: memory
edges:
  - from: 客户端
    to: 网关
    label: HTTPS 请求
    signal: data
  - from: 网关
    to: 鉴权
    label: 校验令牌
    signal: control
  - from: 网关
    to: 订单
    label: 创建订单
    signal: data
  - from: 订单
    to: 数据库
    label: 写入
    signal: data
  - from: 订单
    to: 缓存
    label: 读取会话
    signal: data
  - from: 鉴权
    to: 缓存
    label: token
    signal: data
constraints:
  h_gap: 90
  v_gap: 50
