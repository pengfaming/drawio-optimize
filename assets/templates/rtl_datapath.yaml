    signal: control
  - from: imm
    to: id_ex
    label: imm
    signal: data
  - from: regfile
    to: id_ex
    label: operands
    signal: data
  - from: id_ex
    to: alu
    label: op_a/op_b
    signal: data
  - from: alu
    to: ex_mem
    label: result
    signal: data
  - from: ex_mem
    to: dmem
    label: addr/wdata
    signal: data
  - from: dmem
    to: wb
    label: rdata
    signal: data
  - from: wb
    to: regfile
    label: wb_data
    signal: data
  - from: hazard
    to: pc
    label: stall
    signal: control
  - from: hazard
    to: if_id
