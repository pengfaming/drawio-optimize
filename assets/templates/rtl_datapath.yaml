title: RTL Datapath
direction: LR
preset: balanced
groups:
  - id: if_stage
    label: IF
  - id: id_stage
    label: ID
  - id: ex_stage
    label: EX
  - id: mem_stage
    label: MEM / WB
nodes:
  - id: pc
    label: PC
    kind: datapath
    group: if_stage
  - id: imem
    label: I-Mem
    kind: memory
    group: if_stage
  - id: if_id
    label: IF/ID
    kind: datapath
  - id: decode
    label: Decode
    kind: datapath
    group: id_stage
  - id: regfile
    label: Regfile
    kind: memory
    group: id_stage
  - id: id_ex
    label: ID/EX
    kind: datapath
  - id: alu
    label: ALU
    kind: datapath
    group: ex_stage
  - id: imm
    label: Imm Gen
    kind: datapath
    group: id_stage
  - id: ex_mem
    label: EX/MEM
    kind: datapath
  - id: dmem
    label: D-Mem
    kind: memory
    group: mem_stage
  - id: wb
    label: Write-back
    kind: datapath
    group: mem_stage
  - id: hazard
    label: Hazard Unit
    kind: controller
edges:
